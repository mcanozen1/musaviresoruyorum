name: GIB Mevzuat Otomatik Tarayici

on:
  workflow_dispatch: # Actions sekmesinden tek tıkla başlatmanızı sağlar
  schedule:
    - cron: '0 3 * * 1' # Her Pazartesi gece 03:00'te otomatik çalışır

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install requests beautifulsoup4

      - name: Tarayıcıyı Çalıştır
        run: |
          python scraper.py

      - name: Yeni .md Dosyalarını Depoya Kaydet (Git Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mevzuat_md/
          git commit -m "Otomatik GİB Mevzuat .md Güncellemesi" || exit 0
          git push
