name: GIB Mevzuat Otomatik Tarayici

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright ve Tarayıcı Motorunu Kur
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Tarayıcıyı Çalıştır (Chromium)
        run: |
          python scraper.py

      - name: Markdown Dosyalarını Depoya Kaydet (Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mevzuat_md/
          git diff --staged --quiet || (git commit -m "GİB Mevzuat .md Dosyaları Güncellendi" && git push origin HEAD)
