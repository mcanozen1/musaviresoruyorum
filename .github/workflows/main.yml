name: GIB Mevzuat Otomatik Tarayici

on:
  workflow_dispatch: # Actions sekmesinden manuel başlatmak için
  schedule:
    - cron: '0 3 * * 1' # Her Pazartesi gece otomatik çalışma

permissions:
  contents: write # Dosyaları depoya geri yazabilmesi için zorunlu izin

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 saate kadar kesintisiz çalışma izni

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Tarayıcı Scriptini Çalıştır
        run: |
          python scraper.py

      - name: Yeni .md Dosyalarını Depoya Kaydet (Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mevzuat_md/
          git diff --staged --quiet || (git commit -m "GİB Mevzuat Arşivi Güncellendi" && git push origin HEAD)
